[package]
name = "sahayak-backend"
version = "0.1.0"
edition = "2021"
description = "High-performance rule-matching and e-governance API service for Sahayak"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
dotenv = { package = "dotenvy", version = "0.15" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
